<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 260">
  <!-- tower with crenellations -->
  <rect x="20" y="90" width="140" height="170" fill="#fff" />
  <rect x="20" y="76" width="18" height="14" fill="#fff" />
  <rect x="55" y="76" width="18" height="14" fill="#fff" />
  <rect x="90" y="76" width="18" height="14" fill="#fff" />
  <rect x="125" y="76" width="18" height="14" fill="#fff" />

  <!-- domed hall -->
  <rect x="190" y="140" width="220" height="120" fill="#fff" />
  <path d="M230,140 Q300,40 370,140 Z" fill="#fff" />
  <rect x="296" y="15" width="8" height="30" fill="#fff" />
  <circle cx="300" cy="13" r="6" fill="#fff" />

  <!-- columned portico -->
  <polygon points="430,170 515,118 600,170" fill="#fff" />
  <rect x="430" y="170" width="170" height="20" fill="#fff" />
  <rect x="440" y="190" width="12" height="70" fill="#fff" />
  <rect x="476" y="190" width="12" height="70" fill="#fff" />
  <rect x="512" y="190" width="12" height="70" fill="#fff" />
  <rect x="548" y="190" width="12" height="70" fill="#fff" />
  <rect x="584" y="190" width="12" height="70" fill="#fff" />

  <!-- clock tower -->
  <rect x="630" y="60" width="60" height="200" fill="#fff" />
  <polygon points="620,60 660,18 700,60" fill="#fff" />
  <circle cx="660" cy="102" r="15" fill="none" stroke="#fff" stroke-width="4" />
  <path d="M660,92 L660,102 L670,107" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" />

  <!-- modern staggered block -->
  <rect x="720" y="150" width="90" height="110" fill="#fff" />
  <rect x="812" y="108" width="70" height="152" fill="#fff" />
  <rect x="884" y="172" width="100" height="88" fill="#fff" />

  <!-- small rotunda -->
  <rect x="1010" y="170" width="140" height="90" fill="#fff" />
  <path d="M1010,170 Q1080,108 1150,170 Z" fill="#fff" />
  <rect x="1076" y="94" width="6" height="16" fill="#fff" />

  <!-- hedge line -->
  <path
    d="M1170,260 Q1190,222 1210,260 Q1230,222 1250,260 Q1270,222 1290,260 Q1310,222 1330,260 Q1350,222 1370,260 Q1390,222 1410,260 Q1430,222 1450,260 Q1470,222 1490,260 Q1510,222 1530,260 Q1550,222 1570,260 Z"
    fill="#fff"
  />

  <!-- ground line tying the row together -->
  <rect x="0" y="256" width="1600" height="4" fill="#fff" />
</svg>
